<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"> <!-- Define a codificação UTF-8 -->
     <!-- Responsividade em dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cedeefe</title> <!-- Título da aba do navegador -->

    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Ícones Material Symbols (Google) -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- CSS externo -->
    <link rel="stylesheet" href="../estilos/sidebar.css">
    <link rel="stylesheet" href="../estilos/fazendoFlashcards.css">
</head>
<body>
 
    <!-- SIDEBARRRR -->
    <div id="sidebar-container"></div>
<div class="content">

    <div class="topo-flashcards">

      <div class="btnPassar">
        <span class="material-symbols-outlined" id="antesQuest">chevron_left</span>
      </div>

        <div class="informacoes">
            <h3>Geometria Analítica</h3>
            <span>1/10</span>
        </div>
    
      <div class="btnPassar">
        <span class="material-symbols-outlined" id="proxQuest">chevron_right</span>
      </div>

    </div>


    <div class="flashcard-container">

        <div class="flashcard">

            <!-- Pergunta do flashcard, virar para a resposta com um clique na carta ta-->

            <div class="flashcard-pergunta">
                <h5>Pergunta</h5>
                <p>O que é Lorem Ipsum?</p>
            </div>

            <div class="flashcard-resposta">
                <h5>Resposta</h5>
                <p>Lorem Ipsum é simplesmente um texto fictício da indústria tipográfica e de impressão.</p>
            </div>

        </div>

        <div class="flashcard-feedback">

            <button class="btn btn-rosa">
                <i class="bi bi-x-circle"></i>
                Difícil
            </button>

            <button class="btn btn-amarelo">
                <i class="bi bi-dash-circle"></i>
                Médio
            </button>

            <button class="btn btn-verde">
                <i class="bi bi-check-circle"></i>
                Fácil
            </button>

        </div>

    </div>

</div>

<!-- Seu JS da sidebar -->
<script src="../scripts/loadSidebar.js"></script>
<script src="../scripts/sidebar.js"></script>

<!-- Bootstrap JS -->
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
