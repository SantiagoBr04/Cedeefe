<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cedeefe - Roadmap Física</title>

    <!-- Guardião de Autenticação -->
    <script src="../scripts/authGuard.js"></script>

    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Ícones Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS externo -->
    <link rel="stylesheet" href="../estilos/sidebar.css">
    <link rel="stylesheet" href="../estilos/roadmapsDisc.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../imagens/favicon.png">
</head>

<body data-auth-required="true">

    <!-- SIDEBARRRR -->
    <div id="sidebar-container"></div>

    <div class="header">
        <div>
            <h1>Roadmaps</h1>
            <h2>Estude física com mais clareza.</h2>
        </div>

        <span class="icone">
            <span class="material-symbols-outlined icone2">planet</span>
        </span>
    </div>

    <!-- BARRA DE PROGRESSO DA MATÉRIA -->
    <div class="roadmap-progress-box">
        <div class="progress-info">
            <span class="progress-label">Progresso da disciplina</span>
            <span class="progress-value" id="progress-percentage-text">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="roadmap-progress-bar"></div>
        </div>
        <div class="progress-subtext" id="progress-count-text">0 de 0 tópicos concluídos</div>
    </div>

    <div class="timeline" data-roadmap="fisica">

        <!-- Módulo 1 -->
        <div class="modulo">
            <div class="numero">1</div>
            <div class="conteudo">
                <h3>Energia</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="fis-energia-fontes-tipos"> Fontes e tipos de energia</label>
                    <label><input type="checkbox" data-topico-id="fis-energia-transformacao"> Transformação de energia</label>
                    <label><input type="checkbox" data-topico-id="fis-energia-conservacao"> Conservação de energia</label>
                </ul>
            </div>
        </div>

        <!-- Módulo 2 -->
        <div class="modulo">
            <div class="numero">2</div>
            <div class="conteudo">
                <h3>Termodinâmica</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="fis-termodinamica-propagacao-calor"> Formas de propagação do calor</label>
                    <label><input type="checkbox" data-topico-id="fis-termodinamica-equilibrio-termico"> Equilíbrio térmico</label>
                    <label><input type="checkbox" data-topico-id="fis-termodinamica-maquinas-termicas"> Máquinas térmicas</label>
                </ul>
            </div>
        </div>

        <!-- Módulo 3 -->
        <div class="modulo">
            <div class="numero">3</div>
            <div class="conteudo">
                <h3>Eletricidade</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="fis-eletricidade-consumo-energia"> Consumo de energia elétrica</label>
                    <label><input type="checkbox" data-topico-id="fis-eletricidade-circuitos-eletricos"> Circuitos elétricos</label>
                    <label><input type="checkbox" data-topico-id="fis-eletricidade-uso-consciente"> Uso consciente de energia</label>
                </ul>
            </div>
        </div>

        <!-- Módulo 4 -->
        <div class="modulo">
            <div class="numero">4</div>
            <div class="conteudo">
                <h3>Física Ambiental</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="fis-ambiental-efeito-estufa"> Efeito estufa</label>
                    <label><input type="checkbox" data-topico-id="fis-ambiental-aquecimento-global"> Aquecimento global (causas, consequências e mitigação)</label>
                </ul>
            </div>
        </div>

        <!-- Módulo 5 -->
        <div class="modulo">
            <div class="numero">5</div>
            <div class="conteudo">
                <h3>Astronomia</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="fis-astronomia-sistema-solar"> Sistema Solar</label>
                    <label><input type="checkbox" data-topico-id="fis-astronomia-terra-lua"> Terra e Lua</label>
                    <label><input type="checkbox" data-topico-id="fis-astronomia-ordem-grandeza"> Ordem de grandeza astronômica</label>
                    <label><input type="checkbox" data-topico-id="fis-astronomia-evolucao-estelar"> Evolução estelar</label>
                </ul>
            </div>
        </div>

    </div>

    <!-- Seu JS da sidebar e progresso -->
    <script src="../scripts/loadSidebar.js"></script>
    <script src="../scripts/sidebar.js"></script>
    <script src="../scripts/roadmapProgresso.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
