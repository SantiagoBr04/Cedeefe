<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cedeefe - Roadmap Geografia</title>

    <!-- Guardião de Autenticação -->
    <script src="../scripts/authGuard.js"></script>

    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Ícones Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS externo -->
    <link rel="stylesheet" href="../estilos/sidebar.css">
    <link rel="stylesheet" href="../estilos/roadmapsDisc.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../imagens/favicon.png">
</head>

<body data-auth-required="true">

    <!-- SIDEBARRRR -->
    <div id="sidebar-container"></div>

    <div class="header">
        <div>
            <h1>Roadmaps</h1>
            <h2>Conheça o mundo como a palma da sua mão.</h2>
        </div>

        <span class="icone">
            <span class="material-symbols-outlined icone2">globe</span>
        </span>
    </div>

    <!-- BARRA DE PROGRESSO DA MATÉRIA -->
    <div class="roadmap-progress-box">
        <div class="progress-info">
            <span class="progress-label">Progresso da disciplina</span>
            <span class="progress-value" id="progress-percentage-text">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="roadmap-progress-bar"></div>
        </div>
        <div class="progress-subtext" id="progress-count-text">0 de 0 tópicos concluídos</div>
    </div>


    <div class="timeline" data-roadmap="geografia">

        <!-- Módulo 1 -->
        <div class="modulo">
            <div class="numero">1</div>
            <div class="conteudo">
                <h3>Conceitos Básicos</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="geo-conceitos-espaco-geografico"> Espaço geográfico</label>
                    <label><input type="checkbox" data-topico-id="geo-conceitos-representacoes-cartograficas"> Representações cartográficas</label>
                    <label><input type="checkbox" data-topico-id="geo-conceitos-linguagem-grafica"> Linguagem gráfica e iconográfica</label>
                </ul>
            </div>
        </div>

        <!-- Módulo 2 -->
        <div class="modulo">
            <div class="numero">2</div>
            <div class="conteudo">
                <h3>Santa Catarina</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="geo-sc-formacao-territorial"> Formação territorial</label>
                    <label><input type="checkbox" data-topico-id="geo-sc-aspectos-historicos-economicos"> Aspectos históricos, econômicos e sociais</label>
                    <label><input type="checkbox" data-topico-id="geo-sc-dinamica-urbana-rural"> Dinâmica urbana e rural</label>
                    <label><input type="checkbox" data-topico-id="geo-sc-diversidade-ambiental"> Diversidade ambiental</label>
                </ul>
            </div>
        </div>

        <!-- Módulo 3 -->
        <div class="modulo">
            <div class="numero">3</div>
            <div class="conteudo">
                <h3>Brasil</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="geo-br-formacao-territorial"> Formação territorial</label>
                    <label><input type="checkbox" data-topico-id="geo-br-globalizacao-territorio"> Globalização do território</label>
                    <label><input type="checkbox" data-topico-id="geo-br-transformacoes-ambientais"> Transformações ambientais</label>
                </ul>
            </div>
        </div>

        <!-- Módulo 4 -->
        <div class="modulo">
            <div class="numero">4</div>
            <div class="conteudo">
                <h3>Geografia Mundial</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="geo-mundial-capitalismo"> Capitalismo</label>
                    <label><input type="checkbox" data-topico-id="geo-mundial-globalizacao"> Mundialização / globalização</label>
                    <label><input type="checkbox" data-topico-id="geo-mundial-desigualdade-social"> Desigualdade social</label>
                    <label><input type="checkbox" data-topico-id="geo-mundial-mundo-trabalho"> Mundo do trabalho</label>
                </ul>
            </div>
        </div>

    </div>


    <!-- Seu JS da sidebar e progresso -->
    <script src="../scripts/loadSidebar.js"></script>
    <script src="../scripts/sidebar.js"></script>
    <script src="../scripts/roadmapProgresso.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
