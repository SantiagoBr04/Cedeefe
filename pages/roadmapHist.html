<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cedeefe - Roadmap História</title>

    <!-- Guardião de Autenticação -->
    <script src="../scripts/authGuard.js"></script>

    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Ícones Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS externo -->
    <link rel="stylesheet" href="../estilos/sidebar.css">
    <link rel="stylesheet" href="../estilos/roadmapsDisc.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../imagens/favicon.png">
</head>

<body data-auth-required="true">

    <!-- SIDEBARRRR -->
    <div id="sidebar-container"></div>

    <div class="header">
        <div>
            <h1>Roadmaps</h1>
            <h2>Estude a história do mundo com facilidade.</h2>
        </div>

        <span class="icone">
            <span class="material-symbols-outlined icone2">history_edu</span>
        </span>
    </div>

    <!-- BARRA DE PROGRESSO DA MATÉRIA -->
    <div class="roadmap-progress-box">
        <div class="progress-info">
            <span class="progress-label">Progresso da disciplina</span>
            <span class="progress-value" id="progress-percentage-text">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="roadmap-progress-bar"></div>
        </div>
        <div class="progress-subtext" id="progress-count-text">0 de 0 tópicos concluídos</div>
    </div>


    <div class="timeline" data-roadmap="historia">

        <!-- Módulo 1 -->
        <div class="modulo">
            <div class="numero">1</div>
            <div class="conteudo">
                <h3>Fundamentos</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="hist-fund-historiografia"> Historiografia</label>
                    <label><input type="checkbox" data-topico-id="hist-fund-tempo-historico"> Tempo histórico</label>
                    <label><input type="checkbox" data-topico-id="hist-fund-memoria"> Memória</label>
                </ul>
            </div>
        </div>

        <!-- Módulo 2 -->
        <div class="modulo">
            <div class="numero">2</div>
            <div class="conteudo">
                <h3>Santa Catarina</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="hist-sc-povos-originarios"> Povos originários</label>
                    <label><input type="checkbox" data-topico-id="hist-sc-colonizacao"> Colonização</label>
                    <label><input type="checkbox" data-topico-id="hist-sc-minorias-etnico-raciais"> Minorias e questões étnico-raciais</label>
                    <label><input type="checkbox" data-topico-id="hist-sc-guerra-contestado"> Guerra do Contestado</label>
                </ul>
            </div>
        </div>

        <!-- Módulo 3 -->
        <div class="modulo">
            <div class="numero">3</div>
            <div class="conteudo">
                <h3>Brasil</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="hist-br-povos-originarios"> Povos originários</label>
                    <label><input type="checkbox" data-topico-id="hist-br-escravidao"> Escravidão</label>
                    <label><input type="checkbox" data-topico-id="hist-br-independencia"> Independência</label>
                    <label><input type="checkbox" data-topico-id="hist-br-brasil-monarquico"> Brasil Monárquico</label>
                    <label><input type="checkbox" data-topico-id="hist-br-proclamacao-republica"> Proclamação da República</label>
                    <label><input type="checkbox" data-topico-id="hist-br-republica-velha"> República Velha</label>
                    <label><input type="checkbox" data-topico-id="hist-br-era-vargas"> Era Vargas</label>
                    <label><input type="checkbox" data-topico-id="hist-br-ditadura-militar"> Ditadura Militar</label>
                    <label><input type="checkbox" data-topico-id="hist-br-redemocratizacao"> Redemocratização</label>
                    <label><input type="checkbox" data-topico-id="hist-br-neoliberalismo"> Neoliberalismo</label>
                </ul>
            </div>
        </div>

        <!-- Módulo 4 -->
        <div class="modulo">
            <div class="numero">4</div>
            <div class="conteudo">
                <h3>História Geral</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="hist-geral-antiguidade"> Antiguidade</label>
                    <label><input type="checkbox" data-topico-id="hist-geral-idade-media"> Idade Média</label>
                    <label><input type="checkbox" data-topico-id="hist-geral-idade-moderna"> Idade Moderna</label>
                    <label><input type="checkbox" data-topico-id="hist-geral-estados-nacionais"> Estados Nacionais</label>
                    <label><input type="checkbox" data-topico-id="hist-geral-reformas-religiosas"> Reformas religiosas</label>
                    <label><input type="checkbox" data-topico-id="hist-geral-expansao-maritima"> Expansão marítima</label>
                    <label><input type="checkbox" data-topico-id="hist-geral-iluminismo"> Iluminismo</label>
                    <label><input type="checkbox" data-topico-id="hist-geral-revolucoes-burguesas"> Revoluções burguesas</label>
                </ul>
            </div>
        </div>

        <!-- Módulo 5 -->
        <div class="modulo">
            <div class="numero">5</div>
            <div class="conteudo">
                <h3>História Contemporânea</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="hist-contemp-revolucao-industrial"> Revolução Industrial</label>
                    <label><input type="checkbox" data-topico-id="hist-contemp-imperialismo"> Imperialismo</label>
                    <label><input type="checkbox" data-topico-id="hist-contemp-guerras-mundiais"> Guerras Mundiais</label>
                    <label><input type="checkbox" data-topico-id="hist-contemp-periodo-entreguerras"> Período entreguerras</label>
                    <label><input type="checkbox" data-topico-id="hist-contemp-guerra-fria"> Guerra Fria</label>
                    <label><input type="checkbox" data-topico-id="hist-contemp-independencias-africa-asia"> Independências na África e Ásia</label>
                    <label><input type="checkbox" data-topico-id="hist-contemp-movimentos-resistencia"> Movimentos de resistência</label>
                    <label><input type="checkbox" data-topico-id="hist-contemp-contracultura"> Contracultura</label>
                    <label><input type="checkbox" data-topico-id="hist-contemp-direitos-humanos"> Direitos Humanos</label>
                </ul>
            </div>
        </div>

    </div>


    <!-- Seu JS da sidebar e progresso -->
    <script src="../scripts/loadSidebar.js"></script>
    <script src="../scripts/sidebar.js"></script>
    <script src="../scripts/roadmapProgresso.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
