<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cedeefe</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../estilos/sidebar.css">
    <link rel="stylesheet" href="../estilos/perfilUsuario.css">
    <!-- Guardião de Autenticação -->
    <script src="../scripts/authGuard.js"></script>
</head>

<body class="perfil-body" data-auth-required="true">

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <main class="content">
        <!-- PÁGINA SOMENTE COM MOCKDATA (perfilUsuario2.js)!!! esqueci de duplicar o css... -->

        <!-- CABEÇALHO -->
        <section class="perfil-cabecalho">

            <div class="perfil-foto">

                <div class="perfil-avatar" id="perfilAvatar">
                    A
                </div>

                <label class="btn-foto" for="fotoPerfil">
                    <i class="bi bi-camera-fill"></i>
                </label>

                <input
                    type="file"
                    id="fotoPerfil"
                    accept="image/png,image/jpeg,image/webp,image/gif"
                    hidden>

            </div>

            <div class="perfil-cabecalho-texto">

                <p class="perfil-selo">
                    Conta do aluno
                </p>

                <h1>Meu Perfil</h1>

                <p>
                    Atualize seus dados pessoais e gerencie sua conta.
                </p>

            </div>

        </section>

        <form id="formPerfil" class="perfil-grid">

            <!-- DADOS -->

            <section class="perfil-card">

                <h2>Informações pessoais</h2>

                <div class="mb-3">
                    <label class="form-label" for="nomeCompleto">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="nomeCompleto"
                        name="nomeCompleto"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="dataNascimento">
                        Data de nascimento
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        id="dataNascimento"
                        name="dataNascimento">
                </div>

                <div class="mb-3">

                    <label class="form-label d-block">
                        Gênero
                    </label>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="masc" name="genero" value="Masculino">
                        <label class="form-check-label" for="masc">Masculino</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="fem" name="genero" value="Feminino">
                        <label class="form-check-label" for="fem">Feminino</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="nb" name="genero" value="Não-binário">
                        <label class="form-check-label" for="nb">Não-binário</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="nd" name="genero" value="Prefiro não declarar">
                        <label class="form-check-label" for="nd">Prefiro não declarar</label>
                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label" for="escola">
                        Escola
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="escola"
                        name="escola">

                </div>

                <div class="mb-3">

                    <label class="form-label" for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        readonly>

                </div>

                <div class="mb-0">

                    <label class="form-label" for="motivacao">
                        Motivação
                    </label>

                    <textarea
                        class="form-control"
                        id="motivacao"
                        rows="4"
                        maxlength="180"></textarea>

                </div>

            </section>

            <!-- SEGURANÇA -->

            <section class="perfil-card perfil-seguranca">

                <h2>Segurança</h2>

                <div class="perfil-botoes-seguranca">

                    <button
                        type="button"
                        class="btn btn-secondary btn-seguranca"
                        id="alterarSenhaBtn"
                        data-bs-toggle="modal"
                        data-bs-target="#modalSenha">

                        <i class="bi bi-lock-fill"></i>
                        Alterar senha

                    </button>

                    <button
                        type="button"
                        class="btn btn-danger btn-seguranca"
                        id="excluirContaBtn">

                        <i class="bi bi-trash-fill"></i>
                        Excluir conta

                    </button>

                </div>

            </section>

            <!-- BOTÕES -->

            <section class="perfil-card perfil-card-acoes">

                <button
                    type="button"
                    class="btn btn-rosa"
                    id="cancelarBtn">

                    Cancelar

                </button>

                <button
                    type="submit"
                    class="btn btn-verde"
                    id="salvarBtn">

                    Salvar alterações

                </button>

            </section>

        </form>

        <!-- MODAL SENHA -->

        <div
            class="modal fade"
            id="modalSenha"
            tabindex="-1"
            aria-hidden="true">

            <div class="modal-dialog modal-dialog-centered">

                <div class="modal-content">

                    <div class="modal-header">

                        <h5 class="modal-title">
                            Alterar senha
                        </h5>

                        <button
                            class="btn-close"
                            data-bs-dismiss="modal">
                        </button>

                    </div>

                    <div class="modal-body">

                        <form id="formSenha">

                            <div class="mb-3">

                                <label class="form-label">
                                    Senha atual
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="senhaAtual">

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Nova senha
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="novaSenha">

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Confirmar nova senha
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="confirmarSenha">

                            </div>

                        </form>

                    </div>

                    <div class="modal-footer">

                        <button
                            class="btn btn-rosa"
                            data-bs-dismiss="modal">

                            Cancelar

                        </button>

                        <button
                            class="btn btn-verde"
                            id="salvarSenhaBtn">

                            Salvar

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- Scripts -->
    <script src="../scripts/loadSidebar.js"></script>
    <script src="../scripts/sidebar.js"></script>
    <script src="../scripts/perfilUsuario2.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
```
