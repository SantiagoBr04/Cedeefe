<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco de Questões - Cedeefe</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../estilos/sidebar.css">
    <link rel="stylesheet" href="../estilos/procurarQuestoes.css">
    <!-- Guardião de Autenticação -->
    <script src="../scripts/authGuard.js"></script>
</head>
<body data-auth-required="true">

    <!-- Sidebar Reutilizável -->
    <div id="sidebar-container"></div>

    <div class="content">
        <!-- Cabeçalho Principal -->
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4 bg-white p-4 rounded shadow-sm border">
            <div>
                <h2 class="mb-1 fw-bold text-dark d-flex align-items-center flex-wrap gap-2">
                    <i class="bi bi-search-heart text-verde me-2"></i>Banco de Questões
                    <span class="badge bg-secondary fs-6 ms-2" id="badge-total-questoes">Carregando...</span>
                </h2>
                <p class="text-muted mb-0">Pesquise por questões cadastradas, filtre por disciplina, tema, ano ou autor e pratique direto no banco.</p>
            </div>
            <div>
                <a href="criarLista.html" class="btn btn-verde px-3 py-2 font-weight-bold shadow-sm">
                    <i class="bi bi-plus-circle me-1"></i>Criar Lista Personalizada
                </a>
            </div>
        </div>

        <!-- Alerta de Notificação -->
        <div id="alerta-feedback" class="alert d-none mb-4" role="alert"></div>

        <!-- Painel de Filtros -->
        <div class="card p-4 mb-4 bg-white shadow-sm border">
            <h5 class="fw-bold mb-3 d-flex align-items-center text-dark">
                <i class="bi bi-funnel-fill text-verde me-2"></i>Filtros de Busca
            </h5>
            <form id="form-filtros" class="row g-3">
                <div class="col-md-3">
                    <label for="filtro-disciplina" class="form-label fw-semibold text-secondary">Disciplina</label>
                    <select id="filtro-disciplina" class="form-select shadow-sm">
                        <option value="">Todas as disciplinas</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="filtro-tema" class="form-label fw-semibold text-secondary">Tema</label>
                    <select id="filtro-tema" class="form-select shadow-sm">
                        <option value="">Todos os temas</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="filtro-ano" class="form-label fw-semibold text-secondary">Ano</label>
                    <select id="filtro-ano" class="form-select shadow-sm">
                        <option value="">Todos os anos</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="filtro-autor" class="form-label fw-semibold text-secondary">Autor / Prova</label>
                    <select id="filtro-autor" class="form-select shadow-sm">
                        <option value="">Todos os autores</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="filtro-status" class="form-label fw-semibold text-secondary">Status</label>
                    <select id="filtro-status" class="form-select shadow-sm">
                        <option value="">Todas</option>
                        <option value="nao_respondidas">Não respondidas</option>
                        <option value="ja_respondidas">Já respondidas</option>
                    </select>
                </div>
                <div class="col-md-8">
                    <label for="filtro-busca" class="form-label fw-semibold text-secondary">Busca por Enunciado</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-search"></i></span>
                        <input type="text" id="filtro-busca" class="form-control" placeholder="Digite palavras contidas no enunciado...">
                    </div>
                </div>
                <div class="col-md-4 d-flex align-items-end gap-2">
                    <button type="submit" class="btn btn-verde w-100 py-2 font-weight-bold shadow-sm" id="btn-filtrar">
                        <i class="bi bi-search me-1"></i>Filtrar
                    </button>
                    <button type="button" class="btn btn-outline-secondary w-100 py-2 font-weight-bold" id="btn-limpar-filtros">
                        <i class="bi bi-x-circle me-1"></i>Limpar
                    </button>
                </div>
            </form>
        </div>

        <!-- Container onde os cards de questões serão injetados -->
        <div id="container-questoes-procurar">
            <div class="text-center py-5 bg-white rounded shadow-sm border">
                <div class="spinner-border text-verde mb-3" role="status"></div>
                <p class="text-muted fw-semibold mb-0">Carregando questões do banco de dados...</p>
            </div>
        </div>

        <!-- Controles de Paginação -->
        <div id="container-paginacao" class="d-flex justify-content-center align-items-center gap-2 my-4"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/procurarQuestoes.js"></script>
    <script src="../scripts/loadSidebar.js"></script>
    <script src="../scripts/sidebar.js"></script>
</body>
</html>
