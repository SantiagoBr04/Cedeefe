<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cedeefe - Dashboard</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../estilos/sidebar.css">
    <link rel="stylesheet" href="../estilos/dashboardAdm.css">
    <!-- Guardião de Autenticação -->
    <script src="../scripts/authGuard.js"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="dashboard-body" data-admin-required="true">

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <main class="content">

        <!-- Cabeçalho -->
        <section class="dashboard-header">

            <div>
                <h1 id="admin-nome-greeting">Olá, Administrador</h1>
                <p>Gerencie rapidamente o conteúdo da plataforma.</p>
            </div>

            <div class="dashboard-data">
                <i class="bi bi-calendar3"></i>
                <span id="dashboard-data-texto">--</span>
            </div>

        </section>

        <!-- Grid Principal -->
        <section class="dashboard-grid">

            <!-- Questões reportadas -->
            <div class="dashboard-card">

                <div class="card-topo">
                    <h2>
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        Questões reportadas
                    </h2>

                    <span id="reportadas-badge" class="badge rounded-pill text-bg-danger">
                        0
                    </span>
                </div>

                <div id="reportadas-container">
                    <!-- Questões reportadas serão carregadas dinamicamente aqui -->
                </div>

            </div>

            <!-- Últimas questões -->
            <div class="dashboard-card">

                <div class="card-topo">

                    <h2>
                        <i class="bi bi-journal-plus"></i>
                        Últimas questões
                    </h2>

                    <button id="btn-adicionar-questao" class="btn btn-verde btn-sm">
                        <i class="bi bi-plus-lg"></i>
                        Adicionar
                    </button>

                </div>

                <ul id="ultimas-questoes-container" class="lista-questoes">
                    <!-- Últimas questões serão carregadas dinamicamente aqui -->
                </ul>

            </div>

        </section>

        <!-- Gráfico -->
        <section class="dashboard-card grafico-card">

            <div class="card-topo">

                <h2>
                    <i class="bi bi-bar-chart-fill"></i>
                    Disciplinas mais estudadas
                </h2>

            </div>

            <canvas id="graficoDisciplinas"></canvas>

        </section>

    </main>

    <!-- Sidebar e Scripts -->
    <script src="../scripts/loadSidebar.js"></script>
    <script src="../scripts/sidebar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script de dinamização do Dashboard -->
    <script src="../scripts/dashboardAdm.js"></script>

</body>
</html>
