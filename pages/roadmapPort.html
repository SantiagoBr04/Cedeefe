<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cedeefe</title>

    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Ícones Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS externo -->
    <link rel="stylesheet" href="../estilos/sidebar.css">
    <link rel="stylesheet" href="../estilos/roadmapsDisc.css">
</head>
<body>

     <!-- SIDEBARRRR -->
    <div id="sidebar-container"></div>

    <div class="header">
        <div>
            <h1>Roadmaps</h1>
            <h2>Domine os aspectos da língua portuguesa.</h2>
        </div>

        <span class="icone">
           <span class="material-symbols-outlined icone2">book_3</span>
        </span>
    </div>
            
    <div class="timeline">

      <div class="modulo">
            <div class="numero">1</div>

            <div class="conteudo">
                <h3>Compreensão de Texto</h3>
                <ul>
                    <label><input type="checkbox"> Gêneros do discurso/textuais</label>
                    <label><input type="checkbox"> Modalidades de texto</label>
                </ul>
            </div>
        </div>

        <div class="modulo">
            <div class="numero">2</div>

            <div class="conteudo">
                <h3>Aspectos Linguísticos</h3>
                <ul>
                    <label><input type="checkbox"> Convenções da língua escrita</label>
                    <label><input type="checkbox"> Aspectos fonético-fonológicos (relação fonema-grafema)</label>
                </ul>
            </div>
        </div>

        <div class="modulo">
            <div class="numero">3</div>

            <div class="conteudo">
                <h3>Morfologia e Sintaxe</h3>
                <ul>
                    <label><input type="checkbox"> Aspectos morfológicos (flexões)</label>
                    <label><input type="checkbox"> Ordem da frase</label>
                    <label><input type="checkbox"> Voz ativa e passiva</label>
                    <label><input type="checkbox"> Regência</label>
                    <label><input type="checkbox"> Concordância</label>
                </ul>
            </div>
        </div>

        <div class="modulo">
            <div class="numero">4</div>

            <div class="conteudo">
                <h3>Semântica</h3>
                <ul>
                    <label><input type="checkbox"> Operadores lógico-discursivos</label>
                    <label><input type="checkbox"> Sinonímia</label>
                    <label><input type="checkbox"> Ambiguidade</label>
                    <label><input type="checkbox"> Figuras de linguagem</label>
                </ul>
            </div>
        </div>

        <div class="modulo">
            <div class="numero">5</div>

            <div class="conteudo">
                <h3>Análise Textual</h3>
                <ul>
                    <label><input type="checkbox"> Estratégias argumentativas</label>
                    <label><input type="checkbox"> Recursos linguístico-literários</label>
                    <label><input type="checkbox"> Coesão e coerência</label>
                    <label><input type="checkbox"> Intertextualidade</label>
                    <label><input type="checkbox"> Intencionalidade</label>
                    <label><input type="checkbox"> Contexto e autoria</label>
                </ul>
            </div>
        </div>

        <div class="modulo">
            <div class="numero">6</div>

            <div class="conteudo">
                <h3>Variação Linguística</h3>
                <ul>
                    <label><input type="checkbox"> Variedades do português brasileiro</label>
                    <label><input type="checkbox"> Diferenças fonético-fonológicas, lexicais e sintáticas</label>
                    <label><input type="checkbox"> Variedades prestigiadas e estigmatizadas</label>
                    <label><input type="checkbox"> Preconceito linguístico</label>
                </ul>
            </div>
        </div>
    </div>


    <!-- Seu JS da sidebar -->
    <script src="../scripts/loadSidebar.js"></script>
    <script src="../scripts/sidebar.js"></script>

    <!-- Bootstrap JS (necessário pro dropdown funcionar) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
