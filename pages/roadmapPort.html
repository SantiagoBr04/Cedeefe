<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cedeefe - Roadmap Português</title>

    <!-- Guardião de Autenticação -->
    <script src="../scripts/authGuard.js"></script>

    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Ícones Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS externo -->
    <link rel="stylesheet" href="../estilos/sidebar.css">
    <link rel="stylesheet" href="../estilos/roadmapsDisc.css">
</head>

<body data-auth-required="true">

    <!-- SIDEBARRRR -->
    <div id="sidebar-container"></div>

    <div class="header">
        <div>
            <h1>Roadmaps</h1>
            <h2>Domine os aspectos da língua portuguesa.</h2>
        </div>

        <span class="icone">
            <span class="material-symbols-outlined icone2">book_3</span>
        </span>
    </div>

    <!-- BARRA DE PROGRESSO DA MATÉRIA -->
    <div class="roadmap-progress-box">
        <div class="progress-info">
            <span class="progress-label">Progresso da disciplina</span>
            <span class="progress-value" id="progress-percentage-text">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="roadmap-progress-bar"></div>
        </div>
        <div class="progress-subtext" id="progress-count-text">0 de 0 tópicos concluídos</div>
    </div>

    <div class="timeline" data-roadmap="portugues">

        <div class="modulo">
            <div class="numero">1</div>

            <div class="conteudo">
                <h3>Compreensão de Texto</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="port-compreensao-generos-discurso"> Gêneros do discurso/textuais</label>
                    <label><input type="checkbox" data-topico-id="port-compreensao-modalidades-texto"> Modalidades de texto</label>
                </ul>
            </div>
        </div>

        <div class="modulo">
            <div class="numero">2</div>

            <div class="conteudo">
                <h3>Aspectos Linguísticos</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="port-linguisticos-convencoes-escrita"> Convenções da língua escrita</label>
                    <label><input type="checkbox" data-topico-id="port-linguisticos-fonetico-fonologicos"> Aspectos fonético-fonológicos (relação fonema-grafema)</label>
                </ul>
            </div>
        </div>

        <div class="modulo">
            <div class="numero">3</div>

            <div class="conteudo">
                <h3>Morfologia e Sintaxe</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="port-morfo-flexoes"> Aspectos morfológicos (flexões)</label>
                    <label><input type="checkbox" data-topico-id="port-morfo-ordem-frase"> Ordem da frase</label>
                    <label><input type="checkbox" data-topico-id="port-morfo-voz-ativa-passiva"> Voz ativa e passiva</label>
                    <label><input type="checkbox" data-topico-id="port-morfo-regencia"> Regência</label>
                    <label><input type="checkbox" data-topico-id="port-morfo-concordancia"> Concordância</label>
                </ul>
            </div>
        </div>

        <div class="modulo">
            <div class="numero">4</div>

            <div class="conteudo">
                <h3>Semântica</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="port-semantica-operadores-discursivos"> Operadores lógico-discursivos</label>
                    <label><input type="checkbox" data-topico-id="port-semantica-sinonimia"> Sinonímia</label>
                    <label><input type="checkbox" data-topico-id="port-semantica-ambiguidade"> Ambiguidade</label>
                    <label><input type="checkbox" data-topico-id="port-semantica-figuras-linguagem"> Figuras de linguagem</label>
                </ul>
            </div>
        </div>

        <div class="modulo">
            <div class="numero">5</div>

            <div class="conteudo">
                <h3>Análise Textual</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="port-analise-estrategias-argumentativas"> Estratégias argumentativas</label>
                    <label><input type="checkbox" data-topico-id="port-analise-recursos-literarios"> Recursos linguístico-literários</label>
                    <label><input type="checkbox" data-topico-id="port-analise-coesao-coerencia"> Coesão e coerência</label>
                    <label><input type="checkbox" data-topico-id="port-analise-intertextualidade"> Intertextualidade</label>
                    <label><input type="checkbox" data-topico-id="port-analise-intencionalidade"> Intencionalidade</label>
                    <label><input type="checkbox" data-topico-id="port-analise-contexto-autoria"> Contexto e autoria</label>
                </ul>
            </div>
        </div>

        <div class="modulo">
            <div class="numero">6</div>

            <div class="conteudo">
                <h3>Variação Linguística</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="port-variacao-variedades-pt-br"> Variedades do português brasileiro</label>
                    <label><input type="checkbox" data-topico-id="port-variacao-diferencas-sintaticas"> Diferenças fonético-fonológicas, lexicais e sintáticas</label>
                    <label><input type="checkbox" data-topico-id="port-variacao-variedades-prestigiadas"> Variedades prestigiadas e estigmatizadas</label>
                    <label><input type="checkbox" data-topico-id="port-variacao-preconceito-linguistico"> Preconceito linguístico</label>
                </ul>
            </div>
        </div>
    </div>


    <!-- Seu JS da sidebar e progresso -->
    <script src="../scripts/loadSidebar.js"></script>
    <script src="../scripts/sidebar.js"></script>
    <script src="../scripts/roadmapProgresso.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
