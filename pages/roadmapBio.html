<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cedeefe - Roadmap Biologia</title>

    <!-- Guardião de Autenticação -->
    <script src="../scripts/authGuard.js"></script>

    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Ícones Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS externo -->
    <link rel="stylesheet" href="../estilos/sidebar.css">
    <link rel="stylesheet" href="../estilos/roadmapsDisc.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../imagens/favicon.png">
</head>

<body data-auth-required="true">

    <!-- SIDEBARRRR -->
    <div id="sidebar-container"></div>

    <div class="header">
        <div>
            <h1>Roadmaps</h1>
            <h2>Estude biologia com mais clareza.</h2>
        </div>

        <span class="icone">
            <span class="material-symbols-outlined icone2">microbiology</span>
        </span>
    </div>

    <!-- BARRA DE PROGRESSO DA MATÉRIA -->
    <div class="roadmap-progress-box">
        <div class="progress-info">
            <span class="progress-label">Progresso da disciplina</span>
            <span class="progress-value" id="progress-percentage-text">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="roadmap-progress-bar"></div>
        </div>
        <div class="progress-subtext" id="progress-count-text">0 de 0 tópicos concluídos</div>
    </div>


    <div class="timeline" data-roadmap="biologia">

        <!-- Módulo 1 -->
        <div class="modulo">
            <div class="numero">1</div>
            <div class="conteudo">
                <h3>Citologia</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="bio-citologia-teoria-celular"> Teoria celular</label>
                    <label><input type="checkbox" data-topico-id="bio-citologia-procarioticas-eucarioticas"> Células procarióticas e eucarióticas</label>
                    <label><input type="checkbox" data-topico-id="bio-citologia-estruturas-celulares"> Estruturas celulares</label>
                    <label><input type="checkbox" data-topico-id="bio-citologia-metabolismo-celular"> Metabolismo celular</label>
                    <label><input type="checkbox" data-topico-id="bio-citologia-dna-genes-cromossomos"> DNA, genes e cromossomos</label>
                    <label><input type="checkbox" data-topico-id="bio-citologia-mitose-meiose-gametogenese"> Mitose, meiose e gametogênese</label>
                </ul>
            </div>
        </div>

        <!-- Módulo 2 -->
        <div class="modulo">
            <div class="numero">2</div>
            <div class="conteudo">
                <h3>Ecologia</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="bio-ecologia-biodiversidade"> Biodiversidade</label>
                    <label><input type="checkbox" data-topico-id="bio-ecologia-ecossistemas"> Ecossistemas (inclusive brasileiros)</label>
                    <label><input type="checkbox" data-topico-id="bio-ecologia-sustentabilidade"> Sustentabilidade</label>
                    <label><input type="checkbox" data-topico-id="bio-ecologia-poluicao"> Poluição</label>
                    <label><input type="checkbox" data-topico-id="bio-ecologia-efeito-estufa"> Efeito estufa</label>
                    <label><input type="checkbox" data-topico-id="bio-ecologia-camada-ozonio"> Camada de ozônio</label>
                    <label><input type="checkbox" data-topico-id="bio-ecologia-ameacas-biodiversidade"> Ameaças à biodiversidade</label>
                    <label><input type="checkbox" data-topico-id="bio-ecologia-fontes-tipos-energia"> Fontes e tipos de energia</label>
                    <label><input type="checkbox" data-topico-id="bio-ecologia-conservacao-ambiental"> Conservação ambiental</label>
                    <label><input type="checkbox" data-topico-id="bio-ecologia-educacao-indigena-quilombola"> Educação indígena e quilombola</label>
                </ul>
            </div>
        </div>

        <!-- Módulo 3 -->
        <div class="modulo">
            <div class="numero">3</div>
            <div class="conteudo">
                <h3>Genética e Biotecnologia</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="bio-genetica-estudos-mendel"> Estudos de Mendel</label>
                    <label><input type="checkbox" data-topico-id="bio-genetica-1a-lei-mendel"> 1ª Lei de Mendel</label>
                    <label><input type="checkbox" data-topico-id="bio-genetica-interacoes-alelicas"> Interações alélicas</label>
                    <label><input type="checkbox" data-topico-id="bio-genetica-aplicacoes-genetica"> Aplicações da genética</label>
                    <label><input type="checkbox" data-topico-id="bio-genetica-biotecnologia"> Biotecnologia</label>
                    <label><input type="checkbox" data-topico-id="bio-genetica-questoes-eticas"> Questões éticas, bioéticas e socioambientais</label>
                </ul>
            </div>
        </div>

        <!-- Módulo 4 -->
        <div class="modulo">
            <div class="numero">4</div>
            <div class="conteudo">
                <h3>Seres Vivos</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="bio-seres-vivos-caracteristicas"> Características gerais</label>
                    <label><input type="checkbox" data-topico-id="bio-seres-vivos-classificacao"> Classificação (animais, vegetais, fungos e microrganismos)</label>
                </ul>
            </div>
        </div>

        <!-- Módulo 5 -->
        <div class="modulo">
            <div class="numero">5</div>
            <div class="conteudo">
                <h3>Corpo Humano e Saúde</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="bio-corpo-estrutura-funcionamento"> Estrutura e funcionamento do corpo</label>
                    <label><input type="checkbox" data-topico-id="bio-corpo-vacinas"> Vacinas</label>
                    <label><input type="checkbox" data-topico-id="bio-corpo-doencas-sistemas"> Doenças dos sistemas</label>
                    <label><input type="checkbox" data-topico-id="bio-corpo-substancias-psicoativas"> Substâncias psicoativas</label>
                    <label><input type="checkbox" data-topico-id="bio-corpo-orgaos-sentidos"> Órgãos dos sentidos</label>
                    <label><input type="checkbox" data-topico-id="bio-corpo-ciclo-menstrual"> Ciclo menstrual</label>
                    <label><input type="checkbox" data-topico-id="bio-corpo-fecundacao"> Fecundação</label>
                    <label><input type="checkbox" data-topico-id="bio-corpo-metodos-anticoncepcionais"> Métodos anticoncepcionais</label>
                    <label><input type="checkbox" data-topico-id="bio-corpo-ist"> Infecções sexualmente transmissíveis</label>
                </ul>
            </div>
        </div>

        <!-- Módulo 6 -->
        <div class="modulo">
            <div class="numero">6</div>
            <div class="conteudo">
                <h3>Evolução</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="bio-evolucao-darwinismo-lamarckismo"> Darwinismo e Lamarckismo</label>
                    <label><input type="checkbox" data-topico-id="bio-evolucao-teoria-sintetica"> Teoria sintética</label>
                    <label><input type="checkbox" data-topico-id="bio-evolucao-fatores-evolutivos"> Fatores evolutivos</label>
                    <label><input type="checkbox" data-topico-id="bio-evolucao-registro-fossil"> Registro fóssil</label>
                    <label><input type="checkbox" data-topico-id="bio-evolucao-origem-vida"> Origem da vida</label>
                </ul>
            </div>
        </div>

    </div>


    <!-- Seu JS da sidebar e progresso -->
    <script src="../scripts/loadSidebar.js"></script>
    <script src="../scripts/sidebar.js"></script>
    <script src="../scripts/roadmapProgresso.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
