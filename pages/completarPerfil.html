<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concluir Perfil - Cedeefe</title>

    <!-- Ícones do Bootstrap & Material Symbols -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS externo -->
    <link rel="stylesheet" href="../estilos/sidebar.css">
    <link rel="stylesheet" href="../estilos/criarConta.css">
</head>

<body>

    <!-- SIDEBAR -->
    <div id="sidebar-container"></div>

    <div class="container-fluid">

        <!-- Blobs -->
        <img src="../imagens/blobVerde.svg" alt="blob verde" class="blob-verde">
        <img src="../imagens/blobRosa.svg" alt="blob rosa" class="blob-rosa">

        <div class="criarConta" style="max-width: 550px;">
            <form id="formCompletarPerfil" class="login" action="" method="post">
                <h2 class="titulo-form mb-2">Concluir Perfil</h2>
                <p class="text-muted text-center mb-4">Que bom ter você aqui! Conte-nos um pouco sobre você para personalizar seus estudos.</p>

                <!-- SEÇÃO 1: Dados Pessoais -->
                <div id="etapaPerfil1">
                    <h5 class="text-success fw-bold mb-3">Etapa 1 de 2: Dados Pessoais</h5>

                    <!-- Nome Completo -->
                    <div class="mb-3">
                        <label for="nomeCompleto" class="form-label">Nome Completo *</label>
                        <input type="text" class="form-control" id="nomeCompleto" placeholder="Digite seu nome completo" required>
                    </div>

                    <!-- Data de Nascimento -->
                    <div class="mb-3">
                        <label for="dataNascimento" class="form-label">Data de Nascimento *</label>
                        <input type="date" class="form-control" id="dataNascimento" required>
                    </div>

                    <!-- Gênero -->
                    <div class="mb-3">
                        <label class="form-label d-block">Gênero *</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="genero" id="masc" value="Masculino">
                            <label class="form-check-label" for="masc">Masculino</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="genero" id="fem" value="Feminino">
                            <label class="form-check-label" for="fem">Feminino</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="genero" id="nb" value="Não-binário">
                            <label class="form-check-label" for="nb">Não-binário</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="genero" id="nd" value="Prefiro não declarar" checked>
                            <label class="form-check-label" for="nd">Prefiro não declarar</label>
                        </div>
                    </div>

                    <!-- Botão Continuar -->
                    <button class="btn botao w-100 mt-3" type="button" id="btnContinuarEtapa1">Continuar</button>
                </div>

                <!-- SEÇÃO 2: Dados Acadêmicos & Motivação -->
                <div id="etapaPerfil2" style="display: none;">
                    <h5 class="text-success fw-bold mb-3">Etapa 2 de 2: Objetivos de Estudo</h5>

                    <!-- Escola -->
                    <div class="mb-3">
                        <label for="escola" class="form-label">Escola / Instituição (Opcional)</label>
                        <input type="text" class="form-control" id="escola" placeholder="Nome da sua escola atual">
                    </div>

                    <!-- Motivação -->
                    <div class="mb-3">
                        <label for="motivacao" class="form-label">Por que você está usando o Cedeefe? (Opcional)</label>
                        <textarea class="form-control" id="motivacao" rows="3" maxlength="180" placeholder="Ex: Preparação para a prova do IFC..."></textarea>
                        <div class="form-text">Máximo de 180 caracteres.</div>
                    </div>

                    <!-- Botões Voltar e Concluir -->
                    <div class="d-flex gap-2 mt-4">
                        <button class="btn botao w-50" type="button" id="btnVoltarEtapa2">Voltar</button>
                        <button class="btn botao w-50" type="submit" id="btnSalvar">Salvar e Concluir</button>
                    </div>
                </div>

            </form>
        </div>

    </div>

    <!-- JS -->
    <script src="../scripts/loadSidebar.js"></script>
    <script src="../scripts/sidebar.js"></script>
    <script src="../scripts/completarPerfil.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
