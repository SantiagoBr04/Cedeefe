<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Cedeefe</title>

    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Ícones Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS externo -->
    <link rel="stylesheet" href="../estilos/sidebar.css">
    <link rel="stylesheet" href="../estilos/criarConta.css">
</head>

<body>

    <!-- SIDEBAR -->
    <div id="sidebar-container"></div>

    <div class="container-fluid">

        <!-- Blobs -->
        <img src="../imagens/blobVerde.svg" alt="blob verde" class="blob-verde">
        <img src="../imagens/blobRosa.svg" alt="blob rosa" class="blob-rosa">

        <div class="criarConta">
            <form id="formCriarConta" class="login" action="" method="post">
                <h2 class="titulo-form">Criar Conta</h2>

                <!-- Campo de E-mail -->
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input class="form-control" type="email" id="email" placeholder="seuemail@exemplo.com" required maxlength="50">
                    <div class="form-text">
                        Nunca compartilharemos seu e-mail com ninguém.
                    </div>
                </div>

                <!-- Campo de Senha -->
                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input class="form-control" type="password" id="password" placeholder="Sua senha secreta" required minlength="6" maxlength="100">
                </div>

                <!-- Link para login -->
                <p class="recuperar">
                    Já possui uma conta? <a href="login.html">Entrar</a>
                </p>

                <!-- Botão de submissão -->
                <button class="btn botao w-100 mb-3" type="submit">Criar conta</button>

                <!-- Divisor visual -->
                <div class="d-flex align-items-center my-3">
                    <hr class="flex-grow-1"><span class="px-2 text-muted small">ou</span>
                    <hr class="flex-grow-1">
                </div>

                <!-- Botão oficial de Cadastrar com o Google -->
                <div class="d-flex justify-content-center mb-3">
                    <div id="g_id_onload"
                        data-client_id="672765821915-sffus33vuen1gvht2pte1bnnjfq3bcci.apps.googleusercontent.com"
                        data-callback="handleGoogleCredentialResponse">
                    </div>
                    <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline"
                        data-text="signup_with" data-size="large" data-logo_alignment="left"></div>
                </div>

            </form>
        </div>

    </div>

    <!-- SDK do Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- JS -->
    <script src="../scripts/loadSidebar.js"></script>
    <script src="../scripts/sidebar.js"></script>
    <script src="../scripts/criarConta.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
