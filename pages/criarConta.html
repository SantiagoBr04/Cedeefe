<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cedeefe</title>

    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Ícones Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS externo -->
    <link rel="stylesheet" href="../estilos/sidebar.css">
    <link rel="stylesheet" href="../estilos/criarConta.css">
</head>

<body>

    <!-- SIDEBARRRR -->
    <div id="sidebar-container"></div>



        <!-- SIDEBARRRR -->
<div id="sidebar-container"></div>

<div class="container-fluid">

    <!-- blobs -->
    <img src="../imagens/blobVerde.svg" alt="blob verde" class="blob-verde">
    <img src="../imagens/blobRosa.svg" alt="blob rosa" class="blob-rosa">

    <div class="criarConta">
        <form id="formCriarConta" class="login" action="" method="post">

            <!-- ETAPA 1 -->
            <div id="etapa1">

                <h2 class="titulo-form">Criar Conta</h2>

                <div class="mb-3">
                    <label for="nomeCompleto" class="form-label">Nome completo</label>
                    <input type="text" class="form-control" id="nomeCompleto" required>
                </div>

                <div class="mb-3">
                    <label for="dataNascimento" class="form-label">Data de nascimento</label>
                    <input type="date" class="form-control" id="dataNascimento" required>
                </div>

                <div class="mb-3">

                    <label class="form-label d-block">Gênero</label>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="genero" id="masc">
                        <label class="form-check-label" for="masc">Masculino</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="genero" id="fem">
                        <label class="form-check-label" for="fem">Feminino</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="genero" id="nb">
                        <label class="form-check-label" for="nb">Não-binário</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="genero" id="nd">
                        <label class="form-check-label" for="nd">Prefiro não declarar</label>
                    </div>

                </div>

                <button class="btn botao" type="button" onclick="proximaPagina1()">Próximo</button>

            </div>

            <!-- ETAPA 2 -->
            <div id="etapa2">

                <h2 class="titulo-form">Criar Conta</h2>

                <div class="mb-3">
                    <label class="form-label">Escola</label>
                    <input type="text" class="form-control">
                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Por que você está usando o Cedeefe?
                    </label>

                    <textarea
                        class="form-control"
                        rows="3"
                        maxlength="180">
                    </textarea>

                    <div class="form-text">
                        Máximo de 180 caracteres.
                    </div>

                </div>

                <button class="btn botao" type="button" onclick="voltarPagina1()">Voltar</button>

                <button class="btn botao" type="button" onclick="proximaPagina2()">Próximo</button>

            </div>

            <!-- ETAPA 3 -->
            <div id="etapa3">

                <h2 class="titulo-form">Criar Conta</h2>

                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input class="form-control" type="email">

                    <div class="form-text">
                        Nunca compartilharemos seu e-mail com ninguém.
                    </div>

                </div>

                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input class="form-control" type="password">
                </div>

                <div class="mb-3 form-check">

                    <input class="form-check-input" type="checkbox" id="lembrarSenha">

                    <label class="form-check-label" for="lembrarSenha">
                        Lembrar-me
                    </label>

                </div>

                <p class="recuperar">
                    Já possui uma conta?
                    <a href="login.html">Entrar</a>
                </p>

                <button class="btn botao" type="button" onclick="voltarPagina2()">Voltar</button>

                <button class="btn botao" type="submit">Criar conta</button>

            </div>

        </form>
    </div>

</div>



    <!-- Seu JS da sidebar -->
    <script src="../scripts/loadSidebar.js"></script>
    <script src="../scripts/sidebar.js"></script>

    <script src="../scripts/etapasConta.js"></script>
    <script src="../scripts/criarConta.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
