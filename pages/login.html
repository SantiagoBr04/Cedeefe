<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8"> <!-- Define a codificação UTF-8 -->
    <!-- Responsividade em dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cedeefe</title> <!-- Título da aba do navegador -->

    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Ícones Material Symbols (Google) -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- CSS externo -->
    <link rel="stylesheet" href="../estilos/sidebar.css">
    <link rel="stylesheet" href="../estilos/login.css">
</head>

<body>

    <!-- SIDEBARRRR -->
    <div id="sidebar-container"></div>

    <div class="container-fluid">

        <!-- blobs -->
        <img src="../imagens/blobVerde.svg" alt="blob Verde" class="blob-verde">
        <img src="../imagens/blobRosa.svg" alt="blob rosa" class="blob-rosa">

        <!-- Formulário de Login -->
        <div class="cont-login">
            <form class="login" id="login-form" action="" method="post">
                <h2 class="titulo-form">Login</h2>

                <!-- Campo de email -->
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" maxlength="50">
                    <div id="emailHelp" class="form-text">Nunca compartilharemos seu e-mail com ninguém.</div>
                </div>

                <!-- Campo de senha -->
                <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="exampleInputPassword1" maxlength="100">
                </div>

                <!-- Checkbox "lembrar-me"-->
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="exampleCheck1">
                    <label class="form-check-label" for="exampleCheck1">Lembrar-me</label>
                </div>

                <!-- Links para recuperação de senha e criação de conta -->
                <p class="recuperar">
                    Esqueceu sua senha? <a href="recuperarSenha.html"> Clique aqui!</a><br>
                    Não tem uma conta? <a href="criarConta.html"> Criar conta</a>
                </p>

                <!-- Botão de login tradicional -->
                <button type="submit" class="btn botao w-100 mb-3">Entrar</button>

                <!-- Divisor visual -->
                <div class="d-flex align-items-center my-3">
                    <hr class="flex-grow-1"><span class="px-2 text-muted small">ou</span>
                    <hr class="flex-grow-1">
                </div>

                <!-- Botão oficial de Login com o Google -->
                <div class="d-flex justify-content-center mb-3">
                    <div id="g_id_onload"
                        data-client_id="672765821915-sffus33vuen1gvht2pte1bnnjfq3bcci.apps.googleusercontent.com"
                        data-callback="handleGoogleCredentialResponse">
                    </div>
                    <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline"
                        data-text="signin_with" data-size="large" data-logo_alignment="left"></div>
                </div>
            </form>
        </div>
    </div>

    <!-- SDK do Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Seu JS da sidebar -->
    <script src="../scripts/loadSidebar.js"></script>
    <script src="../scripts/sidebar.js"></script>
    <script src="../scripts/login.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
