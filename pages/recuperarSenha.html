<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Cedeefe</title>

    <!-- Ícones do Bootstrap & Material Symbols -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

    <!-- CSS externo -->
    <link rel="stylesheet" href="../estilos/sidebar.css">
    <link rel="stylesheet" href="../estilos/login.css">
</head>
<body>
 
    <!-- SIDEBAR -->
    <div id="sidebar-container"></div>

<div class="container-fluid">

    <!-- Blobs -->
    <img src="../imagens/blobVerde.svg" alt="blob Verde" class="blob-verde">
    <img src="../imagens/blobRosa.svg" alt="blob rosa" class="blob-rosa">

    <!-- Formulário de Recuperação de Senha -->
    <div class="cont-login">
        <form class="login" id="formRecuperarSenha" action="" method="post">
            <h2 class="titulo-form">Recuperar Senha</h2>

            <p class="text-muted text-center mb-4">
                Informe o seu e-mail de cadastro. Enviaremos um link de acesso para você redefinir sua senha com segurança.
            </p>

            <!-- Campo de email -->
            <div class="mb-3">
                <label for="emailInput" class="form-label">E-mail Cadastrado</label>
                <input type="email" class="form-control" id="emailInput" placeholder="seuemail@exemplo.com" required>
            </div>

            <!-- Botão de Envio -->
            <button type="submit" class="btn botao w-100 mt-2" id="btnEnviar">Enviar Link de Recuperação</button>

            <!-- Link de retorno ao login -->
            <p class="recuperar mt-4 text-center">
                Lembrou sua senha? <a href="login.html">Voltar ao Login</a>
            </p>
        </form>
    </div>
</div>

<!-- JS -->
<script src="../scripts/loadSidebar.js"></script>
<script src="../scripts/sidebar.js"></script>
<script src="../scripts/recuperarSenha.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
