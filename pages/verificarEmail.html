<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de E-mail - Cedeefe</title>

    <!-- Ícones do Bootstrap & Material Symbols -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

    <!-- CSS externo -->
    <link rel="stylesheet" href="../estilos/sidebar.css">
    <link rel="stylesheet" href="../estilos/login.css">
</head>
<body>
 
    <!-- SIDEBAR -->
    <div id="sidebar-container"></div>

<div class="container-fluid">

    <!-- Blobs -->
    <img src="../imagens/blobVerde.svg" alt="blob Verde" class="blob-verde">
    <img src="../imagens/blobRosa.svg" alt="blob rosa" class="blob-rosa">

    <!-- Painel de Verificação -->
    <div class="cont-login">
        <div class="login text-center" id="cardVerificacao">
            <h2 class="titulo-form mb-4">Verificação de E-mail</h2>

            <div id="statusLoading" class="py-4">
                <div class="spinner-border text-success mb-3" role="status" style="width: 3rem; height: 3rem;">
                    <span class="visually-hidden">Carregando...</span>
                </div>
                <p class="lead">Validando seu token de acesso...</p>
            </div>

            <div id="statusSuccess" class="d-none py-3">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 3.5rem;"></i>
                <h4 class="mt-3 text-success">E-mail verificado com sucesso!</h4>
                <p class="text-muted mt-2 mb-4">Sua conta já está ativa e pronta para uso. Clique no botão abaixo para fazer login.</p>
                <a href="login.html" class="btn botao w-100">Ir para o Login</a>
            </div>

            <div id="statusError" class="d-none py-3">
                <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 3.5rem;"></i>
                <h4 class="mt-3 text-danger" id="tituloErro">Falha na verificação</h4>
                <p class="text-muted mt-2 mb-4" id="mensagemErro">O link de verificação é inválido ou já expiraou.</p>
                <div id="boxReenviar" class="d-none mb-3">
                    <button id="btnReenviar" class="btn btn-outline-secondary w-100">Reenviar E-mail de Verificação</button>
                </div>
                <a href="login.html" class="btn botao w-100">Voltar para o Login</a>
            </div>
        </div>
    </div>
</div>

<!-- JS -->
<script src="../scripts/loadSidebar.js"></script>
<script src="../scripts/sidebar.js"></script>
<script src="../scripts/verificarEmail.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
