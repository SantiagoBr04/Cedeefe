<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Flashcards - Cedeefe</title>

    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Ícones Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- CSS externo -->
    <link rel="stylesheet" href="../estilos/sidebar.css">
    <link rel="stylesheet" href="../estilos/verBaralhos.css">
    <!-- Guardião de Autenticação -->
    <script src="../scripts/authGuard.js"></script>
</head>

<body data-auth-required="true">

    <div id="sidebar-container"></div>

    <div class="content">

        <!-- HEADER -->
        <div class="header">
            <h1 class="header-title">Meus Flashcards</h1>

            <div class="header-actions">
                <button type="button" class="btn btn-rosa" id="btn-abrir-modal-baralho">
                    <i class="bi bi-plus-lg"></i> Criar baralho
                </button>

                <a href="adicionarCartao.html">
                    <button type="button" class="btn btn-verde">
                        <i class="bi bi-card-plus"></i> Criar cartão
                    </button>
                </a>
            </div>
        </div>

        <!-- CARDS DE BARALHOS -->
        <div class="baralhos" id="baralhos-container">
            <!-- Injetado dinamicamente via JS -->
        </div>

    </div>

    <!-- MODAL CENTRAL: CRIAR BARALHO -->
    <div class="modal fade" id="modalCriarBaralho" tabindex="-1" aria-labelledby="modalCriarBaralhoLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalCriarBaralhoLabel">Criar Novo Baralho</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <label for="nomeBaralhoInput" class="form-label">Nome do baralho</label>
                    <input type="text" class="form-control" id="nomeBaralhoInput"
                        placeholder="Digite o nome do baralho">
                    <div id="erroCriarBaralho" class="text-danger mt-2" style="display: none;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-verde" id="btnSalvarBaralho">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL CENTRAL: EDITAR BARALHO -->
    <div class="modal fade" id="modalEditarBaralho" tabindex="-1" aria-labelledby="modalEditarBaralhoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalEditarBaralhoLabel">Editar Baralho</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editBaralhoIdInput">
                    <label for="nomeBaralhoEditarInput" class="form-label">Nome do baralho</label>
                    <input type="text" class="form-control" id="nomeBaralhoEditarInput" placeholder="Digite o novo nome do baralho">
                    <div id="erroEditarBaralho" class="text-danger mt-2" style="display: none;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-verde" id="btnSalvarEdicaoBaralho">Salvar Alterações</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: CONFIRMAÇÃO DE EXCLUSÃO DE BARALHO -->
    <div class="modal fade" id="modalDeletarBaralho" tabindex="-1" aria-labelledby="modalDeletarBaralhoLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalDeletarBaralhoLabel">Excluir Baralho</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <p>Tem certeza que deseja excluir o baralho <strong id="nomeBaralhoDeletar"></strong>?</p>
                    <p class="text-muted small mb-0">Esta ação excluirá permanentemente todos os cartões deste baralho.
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-rosa" id="btnConfirmarDeletarBaralho">Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../scripts/loadSidebar.js"></script>
    <script src="../scripts/sidebar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/verBaralhos.js"></script>

</body>

</html>
