<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cedeefe - Dashboard</title>
    <meta name="description" content="Painel principal do Cedeefe — acompanhe seu progresso de estudos para o processo seletivo do IFC.">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="../estilos/sidebar.css">
    <link rel="stylesheet" href="../estilos/dashboard.css">
    
    <!-- Guardião de Autenticação -->
    <script src="../scripts/authGuard.js"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../imagens/favicon.png">
</head>
<body data-auth-required="true">

    <!-- SIDEBARRRR -->
    <div id="sidebar-container"></div>

    <main class="dashboard-main py-4">
        <div class="container-fluid px-4">

            <!-- Banner de Saudação -->
            <div class="welcome-banner mb-4">
                <div class="welcome-text">
                    <h2 id="welcome-greeting">Olá!</h2>
                    <p id="welcome-date">Carregando...</p>
                </div>
                <i class="bi bi-mortarboard-fill welcome-icon d-none d-md-block"></i>
            </div>

            <!-- Cards de Estatísticas Rápidas -->
            <div class="stats-row mb-4">
                <div class="stat-card rosa">
                    <div class="stat-icon rosa-bg">
                        <i class="bi bi-check-circle-fill"></i>
                    </div>
                    <div class="stat-info">
                        <strong id="stat-questoes">0</strong>
                        <small>Questões respondidas</small>
                    </div>
                </div>
                <div class="stat-card verde">
                    <div class="stat-icon verde-bg">
                        <i class="bi bi-bullseye"></i>
                    </div>
                    <div class="stat-info">
                        <strong id="stat-taxa">0%</strong>
                        <small>Taxa de acertos</small>
                    </div>
                </div>
                <div class="stat-card rosa">
                    <div class="stat-icon rosa-bg">
                        <i class="bi bi-card-text"></i>
                    </div>
                    <div class="stat-info">
                        <strong id="stat-flashcards">0</strong>
                        <small>Flashcards revisados</small>
                    </div>
                </div>
                <div class="stat-card verde">
                    <div class="stat-icon verde-bg">
                        <i class="bi bi-journal-check"></i>
                    </div>
                    <div class="stat-info">
                        <strong id="stat-listas">0</strong>
                        <small>Listas concluídas</small>
                    </div>
                </div>
            </div>

            <div class="row">
                <!-- Coluna Esquerda: 2/3 -->
                <div class="col-lg-8 left-col">
                    
                    <!-- Gráficos de Acertos -->
                    <div class="row mb-4">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <div class="chart-card h-100">
                                <div class="card-body d-flex flex-column align-items-center justify-content-center">
                                    <h5 class="card-title text-center">Acertos — Geral</h5>
                                    <div class="chart-container">
                                        <canvas id="geralChart"></canvas>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="chart-card h-100">
                                <div class="card-body d-flex flex-column align-items-center justify-content-center">
                                    <h5 class="card-title text-center">Acertos — Por Disciplina</h5>
                                    <div class="chart-container">
                                        <canvas id="disciplinaChart"></canvas>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Mapa de Calor -->
                    <div class="heatmap-card mb-4">
                        <div class="card-body">
                            <h5 class="card-title mb-3">Flashcards Resolvidos (Últimos 180 dias)</h5>
                            <div id="heatmap-container" class="heatmap-grid">
                                <!-- Gerado dinamicamente -->
                            </div>
                            <div class="heatmap-legend mt-2 d-flex align-items-center gap-2">
                                <small>Menos</small>
                                <div class="heatmap-cell lvl-0"></div>
                                <div class="heatmap-cell lvl-1"></div>
                                <div class="heatmap-cell lvl-2"></div>
                                <div class="heatmap-cell lvl-3"></div>
                                <div class="heatmap-cell lvl-4"></div>
                                <small>Mais</small>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Coluna Direita: 1/3 -->
                <div class="col-lg-4 right-col d-flex flex-column">
                    
                    <!-- Perfil do Usuário -->
                    <div class="profile-card mb-4 text-center">
                        <div class="card-body">
                            <div class="profile-img-container mx-auto mb-3">
                                <img src="https://ui-avatars.com/api/?name=User&background=random" id="profile-img" alt="Foto do perfil" class="rounded-circle img-fluid">
                            </div>
                            <h4 class="card-title mb-0" id="profile-name">Carregando...</h4>
                            <p class="text-muted mt-1" id="profile-role">Estudante</p>
                        </div>
                    </div>

                    <!-- Calendário -->
                    <div class="calendar-card flex-grow-1">
                        <div class="card-body d-flex flex-column">
                            <div class="calendar-header d-flex justify-content-between align-items-center mb-3">
                                <button id="prev-month" class="btn btn-sm btn-outline-secondary">&lt;</button>
                                <h5 class="card-title mb-0 text-center" id="calendar-month-year">Mês Ano</h5>
                                <button id="next-month" class="btn btn-sm btn-outline-secondary">&gt;</button>
                            </div>
                            
                            <div class="calendar-grid">
                                <div class="calendar-day-header">D</div>
                                <div class="calendar-day-header">S</div>
                                <div class="calendar-day-header">T</div>
                                <div class="calendar-day-header">Q</div>
                                <div class="calendar-day-header">Q</div>
                                <div class="calendar-day-header">S</div>
                                <div class="calendar-day-header">S</div>
                                <!-- Dias gerados dinamicamente -->
                            </div>

                            <div class="calendar-legend mt-auto pt-3 border-top">
                                <h6>Legenda:</h6>
                                <div class="d-flex align-items-center gap-2 mb-1">
                                    <div class="legend-dot-simulado"></div>
                                    <small>Simulados Concluídos</small>
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="legend-dot-lista"></div>
                                    <small>Listas Concluídas</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../scripts/loadSidebar.js"></script>
    <script src="../scripts/sidebar.js"></script>
    <script src="../scripts/dashboard.js"></script>
</body>
</html>
