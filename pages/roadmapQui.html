<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cedeefe - Roadmap Química</title>

    <!-- Guardião de Autenticação -->
    <script src="../scripts/authGuard.js"></script>

    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Ícones Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS externo -->
    <link rel="stylesheet" href="../estilos/sidebar.css">
    <link rel="stylesheet" href="../estilos/roadmapsDisc.css">
</head>

<body data-auth-required="true">

    <!-- SIDEBARRRR -->
    <div id="sidebar-container"></div>


    <div class="header">
        <div>
            <h1>Roadmaps</h1>
            <h2>Domine os aspectos da química.</h2>
        </div>

        <span class="icone">
            <span class="material-symbols-outlined icone2">experiment</span>
        </span>
    </div>

    <!-- BARRA DE PROGRESSO DA MATÉRIA -->
    <div class="roadmap-progress-box">
        <div class="progress-info">
            <span class="progress-label">Progresso da disciplina</span>
            <span class="progress-value" id="progress-percentage-text">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="roadmap-progress-bar"></div>
        </div>
        <div class="progress-subtext" id="progress-count-text">0 de 0 tópicos concluídos</div>
    </div>

    <div class="timeline" data-roadmap="quimica">

        <!-- Módulo 1 -->
        <div class="modulo">
            <div class="numero">1</div>
            <div class="conteudo">
                <h3>Matéria</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="qui-materia-propriedades"> Propriedades da matéria</label>
                    <label><input type="checkbox" data-topico-id="qui-materia-estados-fisicos"> Estados físicos</label>
                    <label><input type="checkbox" data-topico-id="qui-materia-mudancas-estado"> Mudanças de estado</label>
                </ul>
            </div>
        </div>

        <!-- Módulo 2 -->
        <div class="modulo">
            <div class="numero">2</div>
            <div class="conteudo">
                <h3>Estrutura Atômica</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="qui-atomica-modelos-atomicos"> Modelos atômicos</label>
                    <label><input type="checkbox" data-topico-id="qui-atomica-particulas-subatomicas"> Partículas subatômicas (próton, nêutron, elétron)</label>
                    <label><input type="checkbox" data-topico-id="qui-atomica-numero-atomico-massa"> Número atômico e massa</label>
                    <label><input type="checkbox" data-topico-id="qui-atomica-ions"> Íons</label>
                </ul>
            </div>
        </div>

        <!-- Módulo 3 -->
        <div class="modulo">
            <div class="numero">3</div>
            <div class="conteudo">
                <h3>Tabela Periódica</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="qui-tabela-elementos-quimicos"> Elementos químicos</label>
                </ul>
            </div>
        </div>

        <!-- Módulo 4 -->
        <div class="modulo">
            <div class="numero">4</div>
            <div class="conteudo">
                <h3>Substâncias e Misturas</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="qui-misturas-substancias-puras"> Substâncias puras</label>
                    <label><input type="checkbox" data-topico-id="qui-misturas-homogeneas-heterogeneas"> Misturas homogêneas e heterogêneas</label>
                    <label><input type="checkbox" data-topico-id="qui-misturas-fases-componentes"> Fases e componentes</label>
                </ul>
            </div>
        </div>

        <!-- Módulo 5 -->
        <div class="modulo">
            <div class="numero">5</div>
            <div class="conteudo">
                <h3>Separação de Misturas</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="qui-separacao-metodos"> Métodos de separação</label>
                    <label><input type="checkbox" data-topico-id="qui-separacao-misciveis-imisciveis"> Misturas miscíveis e imiscíveis</label>
                </ul>
            </div>
        </div>

        <!-- Módulo 6 -->
        <div class="modulo">
            <div class="numero">6</div>
            <div class="conteudo">
                <h3>Transformações Químicas</h3>
                <ul>
                    <label><input type="checkbox" data-topico-id="qui-transformacoes-evidencias"> Evidências de reações químicas</label>
                    <label><input type="checkbox" data-topico-id="qui-transformacoes-reagentes-produtos"> Reagentes e produtos</label>
                </ul>
            </div>
        </div>

    </div>


    <!-- Seu JS da sidebar e progresso -->
    <script src="../scripts/loadSidebar.js"></script>
    <script src="../scripts/sidebar.js"></script>
    <script src="../scripts/roadmapProgresso.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
