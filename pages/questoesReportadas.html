<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questões Reportadas - Cedeefe Admin</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../estilos/sidebar.css">
    <link rel="stylesheet" href="../estilos/questoesReportadas.css">
    <link rel="stylesheet" href="../estilos/editorQuestao.css">
    <!-- Guardião de Autenticação -->
    <script src="../scripts/authGuard.js"></script>
</head>

<body class="dashboard-body" data-admin-required="true">

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <main class="content">

    <!-- Cabeçalho -->
    <section class="dashboard-header">
        <div>
            <h1>Questões Reportadas</h1>
            <p>Edite e resolva as questões reportadas pelos usuários com o novo editor de texto e imagens.</p>
        </div>
    </section>

    <section class="lista-reportes">

        <!-- Estado Vazio (exibido quando não houver reportes pendentes) -->
        <div id="estado-vazio-reportes" class="estado-vazio-container" style="display: none;">
            <div class="icone-vazio-wrapper mb-3">
                <i class="bi bi-check-circle-fill"></i>
            </div>
            <h2 class="fw-bold text-dark mb-2">Tudo certo por aqui!</h2>
            <p class="text-muted fs-5 mb-0">Não há nenhuma questão reportada no momento.</p>
        </div>

        <div class="accordion" id="accordionQuestoes">
            <!-- Questões reportadas serão renderizadas dinamicamente aqui -->
        </div>

    </section>

</main>

    <!-- Sidebar e JS -->
    <script src="../scripts/loadSidebar.js"></script>
    <script src="../scripts/sidebar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/editorQuestao.js"></script>
    <script src="../scripts/questoesReportadas.js"></script>

</body>
</html>
