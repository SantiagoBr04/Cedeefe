<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cedeefe - Dashboard</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="../estilos/sidebar.css">
    <link rel="stylesheet" href="../estilos/questoesReportadas.css">
</head>

<body class="dashboard-body">

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <main class="content">

    <!-- Cabeçalho -->
    <section class="dashboard-header">
        <div>
            <h1>Questões Reportadas</h1>
            <p>Edite e resolva as questões reportadas pelos usuários.</p>
        </div>
    </section>

    <section class="lista-reportes">

        <div class="accordion" id="accordionQuestoes">

            <!-- Questão 1 -->
            <div class="accordion-item questao-item">

                <h2 class="accordion-header">

                    <button class="accordion-button collapsed" type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#questao1">

                        <div class="titulo-questao">
                            <strong>#254</strong>
                            <span>Matemática - Equação do 2º Grau</span>
                        </div>

                    </button>

                </h2>

                <div id="questao1"
                    class="accordion-collapse collapse"
                    data-bs-parent="#accordionQuestoes">

                    <div class="accordion-body">

                        <!-- Motivo -->
                        <div class="erro-box">

                            <h5>
                                <i class="bi bi-exclamation-triangle-fill"></i>
                                Motivo do reporte
                            </h5>

                            <p>
                                "A alternativa correta deveria ser a letra D.
                                O resultado apresentado está incorreto."
                            </p>

                        </div>

                        <!-- Área de edição -->

                        <div class="edicao-box">

                            <h5>Editar Questão</h5>

                            <label>Enunciado</label>

                            <textarea class="form-control" rows="4">
                                Resolva a equação x² - 5x + 6 = 0.
                            </textarea>

                            <div class="row mt-4">

                                <div class="col-md-6 mb-3">
                                    <label>Alternativa A</label>
                                    <input class="form-control" value="x = 2">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Alternativa B</label>
                                    <input class="form-control" value="x = 3">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Alternativa C</label>
                                    <input class="form-control" value="x = 2 e 3">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Alternativa D</label>
                                    <input class="form-control" value="Nenhuma">
                                </div>

                            </div>

                            <label>Resposta Correta</label>

                            <select class="form-select mb-4">
                                <option>A</option>
                                <option>B</option>
                                <option selected>C</option>
                                <option>D</option>
                            </select>

                            <div class="acoes">

                                <button class="btn btn-verde">
                                    <i class="bi bi-floppy"></i>
                                    Salvar Alterações
                                </button>

                            </div>

                        </div>
                    </div>
                </div>
            </div>

        </div>

    </section>

</main>

    <!-- Sidebar -->
    <script src="../scripts/loadSidebar2.js"></script>
    <script src="../scripts/sidebar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Gráfico -->
    <script>
        const ctx = document.getElementById("graficoDisciplinas");

        new Chart(ctx, {
            type: "bar",
            data: {
                labels: [
                    "Matemática",
                    "Português",
                    "Biologia",
                    "Química",
                    "Física",
                    "Geografia"
                ],
                datasets: [{
                    data: [41, 28, 14, 9, 5, 3],
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 50
                    }
                }
            }
        });
    </script>

</body>
</html>
